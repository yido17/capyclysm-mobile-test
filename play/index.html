@keyframes step { 0% { background-position: 0 0; } 33.3% { background-position: 50% 0; } 66.6% { background-position: 100% 0; } }
.walker.idle .frames { animation-duration: 1.2s; }
.walker.home .frames { animation: none; background-position: 50% 0; }
.meter { display: flex; align-items: baseline; gap: 10px; min-height: 1.5em; margin-top: clamp(4px, 1.2vh, 10px);
  font-size: clamp(12px, 2.6vh, 17px); }
#status-percent { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3.4em; }
#status-line { font-style: italic; opacity: .8; transition: opacity .3s; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#status-notice { display: none; margin-top: 12px; padding: 10px 12px; border: 2px solid #211f1b; border-radius: 8px;
  background: #fff3d7; font-size: 15px; line-height: 1.4; white-space: pre-line; }
#status.failed .lane, #status.failed .meter { display: none; }
#status.failed #status-notice { display: block; }
#status-trail { display: none; margin-top: 10px; font-size: 13px; line-height: 1.35; }
#status-trail pre { margin: 6px 0; padding: 7px 8px; border: 2px solid #211f1b; border-radius: 8px; background: #fff3d7;
  font: 10px/1.3 ui-monospace, Menlo, Consolas, monospace; white-space: pre; overflow: auto; max-height: 64vh; }
#status-trail button { margin-top: 4px; padding: 7px 18px; border: 2px solid #211f1b; border-radius: 8px; background: #211f1b;
  color: #f3e8cc; font: 700 14px "Trebuchet MS", system-ui, sans-serif; letter-spacing: .08em; }
#status.trail #status-trail { display: block; }
#status.trail .tag, #status.trail .lane, #status.trail .meter { display: none; }
#status.trail .wordmark { max-height: 8vh; }
.stamp { position: absolute; right: 16px; bottom: 9px; font-size: 10px; letter-spacing: .08em; color: rgba(33,31,27,.45); }

    out.push(left('sn', 6) + left(turkish ? 'ekran' : 'screen', 12) + pad('fps', 4) + pad('gap', 6) + pad('wasm', 5) + pad('tex', 5) + pad('buf', 4) + pad('draw', 5) + pad('glb', 5) + pad('idb', 5) + pad('nodes', 6) + pad('objs', 6));
    for (const r of rows.slice(-8)) {
      out.push(left(r.t, 6) + left(r.ph, 12) + pad(r.fps, 4) + pad(r.gap, 6) + pad(r.wasm, 5) + pad(round(r.tex), 5) + pad(round(r.buf), 4) + pad(r.dc, 5) + pad(r.glb, 5) + pad(r.idb, 5) + pad(r.nodes, 6) + pad(r.objs, 6));
    }
    return out.join('\n');
  }
  document.getElementById('status-stamp').textContent = TRAIL;

  const LINES = turkish ? [
    'Hayaletler çarşafları katlıyor…', 'Resepsiyon zili parlatılıyor…', 'Portakal sayılıyor: bir, bir.',
    'Bavullar asansöre taşınıyor…', 'Orkestra akort ediyor…', 'Capytan portakalını düzeltiyor…',
  ] : [
    'The ghosts are folding the sheets…', 'Polishing the front desk bell…', 'Counting the orange: one, one.',
    'Carrying the trunks to the lift…', 'The band is tuning up…', 'Capytan straightens the orange…',
  ];
  const status = document.getElementById('status');
  const lane = document.getElementById('status-lane');
  const walker = document.getElementById('status-walker');
  const percent = document.getElementById('status-percent');
  const line = document.getElementById('status-line');
  const notice = document.getElementById('status-notice');
  let lineIndex = Math.floor(Math.random() * LINES.length);
  line.textContent = LINES[lineIndex];
  const turn = setInterval(() => {
    line.style.opacity = 0;
    setTimeout(() => { lineIndex = (lineIndex + 1) % LINES.length; line.textContent = LINES[lineIndex]; line.style.opacity = .8; }, 300);
  }, 2600);

  // Capytan walks the lane as the bytes arrive; the signpost is the finish
  function walkTo(share) {
    const room = lane.clientWidth - walker.offsetWidth - lane.querySelector('.sign').offsetWidth * 0.55;
    walker.style.left = Math.max(0, room * share) + 'px';
  }
  function setProgress(current, total) {
    if (current > 0 && total > 0) {
      const share = Math.min(1, current / total);
      walker.classList.remove('idle');
      walkTo(share);
      const whole = Math.floor(share * 100);
      percent.textContent = turkish ? '%' + whole : whole + '%';
      lane.setAttribute('aria-valuenow', String(whole));
    } else {
      walker.classList.add('idle');
      percent.textContent = '';
    }
  }
  function finish() {
    clearInterval(turn);
    walkTo(1);
    walker.classList.add('home');
    percent.textContent = turkish ? '%100' : '100%';
    setTimeout(() => {
      status.classList.add('gone');
      setTimeout(() => { status.style.display = 'none'; }, 480);
    }, 380);
  }
  function fail(err) {
    clearInterval(turn);
    const message = err && err.message ? err.message : String(err);
    notice.textContent = (turkish ? 'Oyun açılamadı. Sayfayı yenilemeyi dene.\n\n' : 'The game could not start. Try reloading the page.\n\n') + message;
    status.classList.add('failed');
    console.error(err);
  }

  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length !== 0) {
    if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
      // installing the service worker may bring the missing headers; one reload then
      Promise.race([
        navigator.serviceWorker.getRegistration().then((registration) => {
          if (registration != null) {
            return Promise.reject(new Error('Service worker already exists.'));
          }
          return registration;
        }).then(() => engine.installServiceWorker()),
        new Promise((resolve) => { setTimeout(() => resolve(), 2000); }),
      ]).then(() => { window.location.reload(); }).catch((err) => { fail(err); });
    } else {
      fail(new Error((turkish ? 'Tarayıcıda eksik özellikler:\n' : 'Missing browser features:\n') + missing.join('\n')));
    }
  } else {
    setProgress(0, 0);
    // the game loads behind the card; a card, when there is one, stays until DEVAM
    const ready = trail.decided.then((show) => {
      if (!show) return;
      const HEAD = turkish ? {
        crash: 'Oyun geçen sefer beklenmedik şekilde kapandı. Bu kartın ekran görüntüsünü alıp gönderir misin? Kart kendisi hiçbir şey göndermez; telefonun son dakikası aşağıda.',
        last: 'Bu telefonda kaydedilen çökme. Ekran görüntüsünü alıp gönderebilirsin.',
        prev: 'Kayıtlı bir çökme yok; bu, bir önceki oturumun son dakikası.',
        none: 'Kayıt sistemi çalışıyor, ama bu telefonda henüz kayıt yok.',
      } : {
        crash: 'The game closed unexpectedly last time. Could you take a screenshot of this card and send it? The card itself sends nothing; the phone\'s last minute is below.',
        last: 'A crash recorded on this phone. You can take a screenshot and send it.',
        prev: 'No crash on record; this is the previous session\'s last minute.',
        none: 'The trail works, but this phone has none yet.',
      };
      const box = document.getElementById('status-trail');
      document.getElementById('status-trail-head').textContent = HEAD[show.kind] || HEAD.crash;
      const table = box.querySelector('pre');
      table.textContent = trailText(show);
      const go = document.getElementById('status-go');
      go.textContent = turkish ? 'DEVAM' : 'CONTINUE';
      status.classList.add('trail');
      const bottom = () => { table.scrollTop = table.scrollHeight; };
      bottom(); requestAnimationFrame(bottom); setTimeout(bottom, 250);
      return new Promise((resolve) => { go.onclick = () => { status.classList.remove('trail'); resolve(); }; });
    });
    engine.startGame({ 'onProgress': setProgress }).then(() => ready).then(finish, fail);
  }
}());
</script>
